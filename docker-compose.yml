version: '3.4'
services:
  qtum.avado.dnp.dappnode.eth:
    image: 'qtum.avado.dnp.dappnode.eth:0.0.18'
    build:
      context: ./build
      args:
        - VERSION=v30.3
        - >-
          QTUM_SHA256=49d20626d7941397e09484d0b0beed234ac4aa7c203e01cbb999f0e789b52198
    environment:
      - EXTRA_OPTS=
    volumes:
      - 'data:/package/data'
    ports:
      - '3888:3888'
      - '3889:3889'
      - '13888:13888'
      - '13889:13889'
      - '80:80'
      - '443:443'
      - '8443:8443'
    logging:
      options:
        max-size: 10m
        max-file: '3'
volumes:
  data: {}
