name: Gate
# Every 4 hours, whenever the PR checks finish, and after the bump bot pushed:
# merges the bump bot's PR (merge commit) when "avado/checks" is green and 72
# hours have passed since the Qtum release, or at once for a hard fork. A new
# MAJOR Qtum version is never merged here: the owner gets an issue to review it.
# Otherwise it waits, or stops and opens an issue for the owner. It also keeps
# the owner's hard-fork issues up to date (estimated date, closes when
# production runs the fork), and starts release.yml when a version on the
# default branch never got a release run.
# Details: .github/pipeline/gate.mjs. It never runs code from a pull request:
# it runs the default branch's code and reads the GitHub API.
# Repository variable PIPELINE_MODE: not set or "shadow" = decide and comment,
# never merge (the default); "on" = merge; "off" = do nothing.
on:
  schedule:
    - cron: '53 */4 * * *'
  workflow_run: # PR checks started by a person or PAT_TOKEN
    workflows: ['PR checks']
    types: [completed]
  workflow_dispatch: # the bump bot, and PR checks it started without PAT_TOKEN

permissions:
  contents: write # merge
  pull-requests: write
  issues: write
  statuses: write # avado/gate
  actions: write # re-runs checks that failed on an outside cause; starts release.yml after the merge (a GITHUB_TOKEN merge does not)

concurrency:
  group: gate
  cancel-in-progress: false

# bash -eo pipefail for every step: a failing command in front of a pipe
# (for example "check | tee log") fails its step.
defaults:
  run:
    shell: bash

jobs:
  gate:
    if: vars.PIPELINE_MODE != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # "Release ..." commits tell which versions are released
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Gate
        run: node .github/pipeline/gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # optional, read-only: the release watcher's URGENT issues (a fine-grained
          # token for AvadoDServer/avado-release-control, Issues: read)
          WATCHER_READ_TOKEN: ${{ secrets.WATCHER_READ_TOKEN }}
          PIPELINE_MODE: ${{ vars.PIPELINE_MODE }}
          PIPELINE_OWNER: ${{ vars.PIPELINE_OWNER }}
      - name: Tell the owner if this workflow broke
        if: failure() || cancelled()
        run: node .github/pipeline/report.mjs failure "Gate"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_OWNER: ${{ vars.PIPELINE_OWNER }}
          JOB_STATUS: ${{ job.status }}
      - if: success()
        run: node .github/pipeline/report.mjs success "Gate"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # GitHub switches off the scheduled workflows of a public repo after 60 days
  # without commits, and Qtum releases come every 4 to 8 months. Enabling them
  # through the API resets that clock (no commit needed; also while
  # PIPELINE_MODE is off, so turning the robots on later just works). Not in a
  # test copy (IPFS_PROVIDER=local): a private repo is never switched off.
  keepalive:
    if: github.event_name == 'schedule' && vars.IPFS_PROVIDER != 'local'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the scheduled robots switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in bump.yml gate.yml; do
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" >/dev/null; then
              echo "$wf: enabled"
            else
              echo "::warning::could not re-enable $wf (the release watcher reports a switched-off workflow)"
            fi
          done
