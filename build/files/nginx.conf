user  nginx;
worker_processes  1;

pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;
    server_tokens off;
    sendfile        on;
    keepalive_timeout  65;

    # Compression config
    gzip on;
    gzip_min_length 1000;
    gzip_buffers 4 32k;
    gzip_proxied any;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # CORS for the monitor: only reading (GET) is open to other web pages
    map $request_method $qtum_monitor_cors {
        GET     '*';
        default '';
    }

  # wallet UI - over HTTPS
  server {
    listen            443 ssl;
    ssl_certificate /etc/nginx/certs/my.ava.do.crt;  
    ssl_certificate_key /etc/nginx/certs/my.ava.do.key;

    add_header Strict-Transport-Security "max-age=0";

    location / {
        root /package/wallet;
        index  index.html index.htm;
        try_files $uri /index.html =404;
    }

    # Don't cache the homepage
    location = /index.html {
        internal;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }
  }

    server {
        listen 80;

        # Which page is calling? Browsers send an Origin header with every POST
        # and with every request from another web site; curl and scripts send
        # none. The wizard is served by this server, so its own calls to /rpc
        # and /monitor/ carry "Origin: http://<the address it was opened at>".
        set $qtum_other_site 0;
        if ($http_origin) {
            set $qtum_other_site 1;
        }
        if ($http_origin = "http://$http_host") {
            set $qtum_other_site 0;
        }
        # reading the monitor (GET) stays open to other pages, as before
        set $qtum_other_site_change $qtum_other_site;
        if ($request_method = GET) {
            set $qtum_other_site_change 0;
        }
        if ($request_method = HEAD) {
            set $qtum_other_site_change 0;
        }

        location ~* ^/monitor/(.*) {
            # Calls that change something (restart, settings, restore, keys)
            # are only accepted from the wizard's own page: a request from
            # another web site is refused, and gets no CORS headers.
            if ($qtum_other_site_change) {
                return 403;
            }

            proxy_hide_header 'Access-Control-Allow-Origin';
            add_header 'Access-Control-Allow-Origin' $qtum_monitor_cors always;

            proxy_pass http://127.0.0.1:3000/$1;
            proxy_read_timeout 90;
        }


        location /rpc {
            # This location adds the node's RPC password, so it only serves the
            # wizard's own page. Any other web page the owner opens could
            # otherwise send coins from the wallet, or read its private keys
            # (listdescriptors true). No CORS headers: other sites cannot read
            # the answers either. Tools without an Origin header (curl) work.
            if ($qtum_other_site) {
                return 403;
            }

            proxy_set_header 'Authorization' 'Basic YXZhZG86YXZhZG8xMjM0';
            proxy_pass_header Authorization;
            proxy_hide_header 'Access-Control-Allow-Origin';

            # the default wallet ("") endpoint, so wallet calls keep working when
            # other wallets are loaded too (e.g. after a wallet upgrade)
            proxy_pass http://127.0.0.1:3889/wallet/; # mainnet
            # proxy_pass http://127.0.0.1:13889/; # testnet
            proxy_read_timeout 90;
        }

        location / {
            root   /package/wizard;
            index  index.html index.htm;
            try_files $uri /index.html =404;
        }

        # Don't cache the homepage
        location = /index.html {
            internal;
            add_header Cache-Control 'no-cache, no-store, must-revalidate';
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}