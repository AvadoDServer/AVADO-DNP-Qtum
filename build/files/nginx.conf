user  nginx;
worker_processes  1;

pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;
    server_tokens off;
    sendfile        on;
    keepalive_timeout  65;

    # Compression config
    gzip on;
    gzip_min_length 1000;
    gzip_buffers 4 32k;
    gzip_proxied any;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # CORS for the monitor: only reading (GET) is open to other web pages
    map $request_method $qtum_monitor_cors {
        GET     '*';
        default '';
    }

    # Qtum Web Wallet (the old web wallet) - over HTTPS on port 8443.
    # Until package 0.0.14 it was at https://qtum.my.ava.do (port 443); it moved
    # here so that qtum.my.ava.do opens the setup wizard on http and https.
    server {
        listen            8443 ssl;
        ssl_certificate /etc/nginx/certs/my.ava.do.crt;
        ssl_certificate_key /etc/nginx/certs/my.ava.do.key;

        # http://qtum.my.ava.do:8443 -> https://qtum.my.ava.do:8443
        error_page 497 =301 https://$host:8443$request_uri;

        add_header Strict-Transport-Security "max-age=0";

        location / {
            root /package/wallet;
            index  index.html index.htm;
            try_files $uri /index.html =404;
        }

        # Don't cache the homepage
        location = /index.html {
            internal;
            add_header Cache-Control 'no-cache, no-store, must-revalidate';
        }
    }

    # Setup wizard - on http (port 80) and https (port 443)
    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate /etc/nginx/certs/my.ava.do.crt;
        ssl_certificate_key /etc/nginx/certs/my.ava.do.key;

        # Which page is calling? Browsers send an Origin header with every POST
        # and with every request from another web site; curl and scripts send
        # none. The wizard is served by this server, so its own calls to /rpc
        # and /monitor/ carry "Origin: <http or https>://<the address it was
        # opened at>". Any other page (another web site, the Qtum Web Wallet on
        # port 8443, the wizard over the other scheme) does not match.
        set $qtum_other_site 0;
        if ($http_origin) {
            set $qtum_other_site 1;
        }
        if ($http_origin = "$scheme://$http_host") {
            set $qtum_other_site 0;
        }
        # reading the monitor (GET) stays open to other pages, as before
        set $qtum_other_site_change $qtum_other_site;
        if ($request_method = GET) {
            set $qtum_other_site_change 0;
        }
        if ($request_method = HEAD) {
            set $qtum_other_site_change 0;
        }

        location ~* ^/monitor/(.*) {
            # Calls that change something (restart, settings, restore, keys)
            # are only accepted from the wizard's own page: a request from
            # another web site is refused, and gets no CORS headers.
            if ($qtum_other_site_change) {
                return 403;
            }

            proxy_hide_header 'Access-Control-Allow-Origin';
            add_header 'Access-Control-Allow-Origin' $qtum_monitor_cors always;

            proxy_pass http://127.0.0.1:3000/$1;
            proxy_read_timeout 90;
        }


        location /rpc {
            # This location adds the node's RPC password, so it only serves the
            # wizard's own page. Any other web page the owner opens could
            # otherwise send coins from the wallet, or read its private keys
            # (listdescriptors true). No CORS headers: other sites cannot read
            # the answers either. Tools without an Origin header (curl) work.
            if ($qtum_other_site) {
                return 403;
            }

            proxy_set_header 'Authorization' 'Basic YXZhZG86YXZhZG8xMjM0';
            proxy_pass_header Authorization;
            proxy_hide_header 'Access-Control-Allow-Origin';

            # the default wallet ("") endpoint, so wallet calls keep working when
            # other wallets are loaded too (e.g. after a wallet upgrade)
            proxy_pass http://127.0.0.1:3889/wallet/; # mainnet
            # proxy_pass http://127.0.0.1:13889/; # testnet
            proxy_read_timeout 90;
        }

        # The wizard's connection to your AVADO (WAMP), used to download and
        # restore wallet backups. A page opened over https may only open a
        # secure (wss://) connection, so the wizard connects here and this is
        # passed on to the AVADO's WAMP (ws://wamp.my.ava.do:8080). Only the
        # wizard's own page may use it: WAMP controls the whole AVADO.
        location = /ws {
            if ($qtum_other_site) {
                return 403;
            }
            # resolve wamp.my.ava.do on each connection (Docker's DNS), so that
            # nginx also starts when WAMP is not there
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $qtum_wamp http://wamp.my.ava.do:8080;
            proxy_pass $qtum_wamp;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }

        location / {
            root   /package/wizard;
            index  index.html index.htm;
            try_files $uri /index.html =404;
        }

        # Don't cache the homepage
        location = /index.html {
            internal;
            add_header Cache-Control 'no-cache, no-store, must-revalidate';
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}