version: '3.4'
services:
  qtum.avado.dnp.dappnode.eth:
    image: 'qtum.avado.dnp.dappnode.eth:0.0.15'
    build:
      context: ./build
      args:
        - VERSION=v30.2
        - >-
          QTUM_SHA256=698dbbd6274d3645e27775c39c1623fa69fa2d400312b44150d127167fa743d2
    environment:
      - EXTRA_OPTS=
    volumes:
      - 'data:/package/data'
    ports:
      - '3888:3888'
      - '3889:3889'
      - '13888:13888'
      - '13889:13889'
      - '80:80'
      - '443:443'
      - '8443:8443'
    logging:
      options:
        max-size: 10m
        max-file: '3'
volumes:
  data: {}
