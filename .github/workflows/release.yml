name: Release
# Publishes the package to the STAGING store when its version is new on the
# default branch (replaces AvadoDServer/ci-release-action for this repo): ONLY
# the exact build the PR checks tested for these files (never a new build),
# its hash recorded in releases.json and in a commit "Release <name>
# <version>", then store.setPackageHash and one store.releaseStore, with the
# RPC_TOKEN secret, like ci-release-action.
# A held package (file "hold") is never published. No new version: nothing is
# published. No tested build, or no RPC_TOKEN: nothing is published, and the
# owner gets an issue (a test copy with IPFS_PROVIDER=local and no RPC_TOKEN is
# a dry run). Production stays the owner's click in editstore.
# A run that is cancelled or runs out of time also opens the issue, and the
# gate starts another run (twice at most, then it opens an issue).
# Details: .github/pipeline/release.mjs.
on:
  push:
    branches: [main, master]
  workflow_dispatch: # the gate starts it after merging; the owner after "PR checks" with pr = main
    inputs:
      dry_run:
        description: 'Only show what would be published'
        type: boolean
        default: false
      release_store:
        description: 'Also ask the store to rebuild staging when nothing is new (after a failed store.releaseStore)'
        type: boolean
        default: false

permissions:
  contents: write # the "Release <name> <version>" commit
  actions: read # the tested build's record
  issues: write # reports a failure of this workflow to the owner

concurrency:
  group: release
  cancel-in-progress: false

# bash -eo pipefail for every step: a failing command in front of a pipe
# (for example "check | tee log") fails its step.
defaults:
  run:
    shell: bash

env:
  # Where the PR checks added the builds (the same expression as pr-checks.yml).
  IPFS_API: ${{ vars.IPFS_PROVIDER == 'local' && 'http://127.0.0.1:5001' || vars.IPFS_PROVIDER || 'http://80.208.229.228:35001' }}

jobs:
  release:
    # Only the default branch is ever released (a run started on another branch does nothing).
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # "Release ..." commits tell which versions are published
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Release
        run: node .github/pipeline/release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RPC_TOKEN: ${{ secrets.RPC_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_STORE: ${{ inputs.release_store }}
      - name: Tell the owner if this workflow broke
        if: failure() || cancelled()
        run: node .github/pipeline/report.mjs failure "Release"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_OWNER: ${{ vars.PIPELINE_OWNER }}
          JOB_STATUS: ${{ job.status }}
      - if: success()
        run: node .github/pipeline/report.mjs success "Release"
        env:
          GITHUB_TOKEN: ${{ github.token }}
