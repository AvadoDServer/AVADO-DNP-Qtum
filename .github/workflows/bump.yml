name: Bump Qtum
# Every 4 hours: if a newer stable Qtum Core release exists (and its Linux
# tarball is attached), open or update ONE pull request on branch
# avado-bot/bump that moves the package to it (VERSION + QTUM_SHA256 in
# docker-compose.yml, and the package version + 1 patch). A release whose PR
# the owner closed is skipped. A hard-fork release ("Mandatory update before
# Mainnet block N") opens an issue for the owner at once, with the block and
# its estimated date. Details: .github/pipeline/bump.mjs.
# Runs unless the repository variable PIPELINE_MODE is off (it only opens PRs;
# the gate decides about merging).
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'TEST ONLY: pretend this Qtum tag (for example v30.3) is the newest release (leave empty for a normal run)'
        required: false
        default: ''
      dry_run:
        description: 'Only print what would happen'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write # starts pr-checks.yml when there is no PAT_TOKEN, and the gate
  issues: write # the hard-fork issue, and a failure of this workflow

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    if: vars.PIPELINE_MODE != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Bump
        run: node .github/pipeline/bump.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Pushes and PRs made with a personal token start the PR checks; see README.
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PIPELINE_OWNER: ${{ vars.PIPELINE_OWNER }}
          PIPELINE_MODE: ${{ vars.PIPELINE_MODE }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
      - name: Tell the owner if this workflow broke
        if: failure()
        run: node .github/pipeline/report.mjs failure "Bump Qtum"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_OWNER: ${{ vars.PIPELINE_OWNER }}
      - if: success()
        run: node .github/pipeline/report.mjs success "Bump Qtum"
        env:
          GITHUB_TOKEN: ${{ github.token }}
